name: VectorJITStandalone
options:
  bundleIdPrefix: com.vector
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "17.4"
    SWIFT_VERSION: "5.0"
targets:
  VectorJITStandalone:
    type: application
    platform: iOS
    sources:
      - VectorJITStandalone
    info:
      path: VectorJITStandalone/Info.plist
    dependencies:
      - framework: Vendor/StikJIT.xcframework
        embed: true
      - sdk: Security.framework
      - sdk: IOKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vector.VectorJITStandalone
        PRODUCT_NAME: VectorJIT
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
        TARGETED_DEVICE_FAMILY: "1,2"
